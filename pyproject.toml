[project]
name = "cs238"
version = "0.1.0"
description = "CS238: Intro to Generative AI (Walla Walla University)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "autogen>=0.9.10",
    "bertviz>=1.4.1",
    "chromadb>=1.3.5",
    "matplotlib>=3.10.7",
    "nltk>=3.9.2",
    "ollama>=0.6.0",
    "openai>=2.3.0",
    "pygame>=2.6.1",
    "pypdf>=6.19.0",
    "pypdf2>=3.0.1",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.64.0",
    "torch>=2.9.0",
    "transformers>=4.57.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
